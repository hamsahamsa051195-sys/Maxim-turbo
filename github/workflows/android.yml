
name: Build Maxim Boost Pro APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -o MaximBoostPro-Android-CloudBuild.zip -d .

      - name: Set Java and Kotlin JVM targets to 17
        working-directory: MaximBoostPro
        run: |
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          if 'compileOptions {' not in s:
              s = s.replace('    defaultConfig {', '''    compileOptions {
          sourceCompatibility = JavaVersion.VERSION_17
          targetCompatibility = JavaVersion.VERSION_17
      }
      defaultConfig {''')
          if 'kotlinOptions {' not in s:
              s = s.replace('\n}\n', '''
      kotlinOptions {
          jvmTarget = "17"
      }
  }
  ''', 1)
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: MaximBoostPro
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maxim-boost-pro-debug-apk
          path: MaximBoostPro/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
